version: "1"

services:
  - type: web
    name: esra-cakes
    env: node
    # Build: Install dependencies in both frontend and backend, then build
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npm run build"
    # Start: Run migrations, then start the Express server
    startCommand: "cd backend && npm run prisma:deploy && NODE_ENV=production node dist/index.js"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: esra-cakes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "http://localhost" # Not used in production as frontend/backend are unified
      - key: WHATSAPP_NUMBER
        value: "447123456789" # UPDATE THIS with your actual number
      - key: SEED_ADMIN_EMAIL
        value: "admin@esracakes.com" # UPDATE THIS
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

databases:
  - name: esra-cakes-db
    databaseName: esracakes
    user: esra
